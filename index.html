<!-- target path: src/taiwan/templates/dashboard_v4.html (copied to output/.../dashboard/v4.html by src/taiwan/dashboard.py)
     v4 (2026-10-21): weight, threshold and scenario sandbox built on the v3 preview. Left: the index, recomputed in the
     page, and the raw legs of the three outcome rows (C7-C9) with adjustable 0-point lines; right: domain and instrument
     weights (total 100) with the monthly score matrix. Starting weights: domains A/B/C/D = 30/30/30/10, each domain's
     share split over its rows in proportion to the saved weights and rounded to whole numbers (largest remainder).
     A row's points scale linearly with its weight (saved points x new weight / saved weight). Outcome rows: the legs
     and thresholds are parsed from the saved monthly details text; moving a 0-point line moves the full-score line by
     the same amount, and the row is rescored in the page as weight x max over legs of the linear ramp (the C7
     hold-until-confirmed rule is not applied). At the saved thresholds the saved scores are used.
     Scenarios: scenarios.js (master scenarios/dashboard_scenarios.js) adds six months after the last scored month;
     rows a scenario does not set decay (episodic, x0.6 a month, dropped below 0.25) or keep their last state.

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  /* theme tokens (same as v3) */

  .tip.pinned { border-color: var(--teal); }

  .strip { display: flex; gap: 1px; height: 14px; }

  .strip i.nd { background: repeating-linear-gradient(45deg, #e5e7eb 0 2px, #fff 2px 4px); }

  .mk.ev { border: 2px solid var(--ink); box-shadow: 0 0 0 1px #fff; }
  .wrow.mhead { border-bottom: none; padding-bottom: 0; }
  .mhead .strip i { background: none; position: relative; }
  .mhead .strip i.sc { background: var(--scen-band); }

  footer { border-top: 1px solid var(--rule); margin-top: 20px; padding: 14px var(--gap) 30px; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); display: flex; gap: 18px; flex-wrap: wrap; }
  footer a { color: var(--teal); }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  @media (max-width: 700px) { .chart-wrap { height: 300px; } .oc-row { grid-template-columns: 1fr; } .wrow { grid-template-columns: 22px minmax(0, 1fr) 64px 52px; } .wrow .src, .mhead > span:nth-child(3) { display: none; } .wrow .strip { grid-column: 1 / -1; } }
</style>

<body>
<header>
  <h1>Taiwan Coercion Pressure Index</h1>
  <label class="scen" id="scen-box" hidden>Scenario <select id="scen"></select></label>

<main>
  <div class="left">
    <section id="s-index">
      <div class="sec-head"><span class="chev"></span><h2>1 · Index</h2><span class="small" id="index-latest"></span></div>
      <div class="sec-body">
        <div class="legend-dots" id="legend-dots"></div>
        <div class="chart-wrap"><canvas id="c-index"></canvas><div class="tip" id="tip"></div></div>
        <div class="range" id="range" title="Drag the handles or the window; double-click for all months"><div class="rc"><canvas id="c-range"></canvas></div><div class="out l"></div><div class="out r"></div><div class="win"><span class="hd l"></span><span class="hd r"></span></div></div>

  <span id="foot-built"></span>

<script src="scenarios.js"></script>
<script>
(function () {
  const D = window.TCPI, V = D.versions[D.versions.length - 1];
  const SCENARIOS = Array.isArray(window.TCPI_SCENARIOS) ? window.TCPI_SCENARIOS : [];
  const $ = id => document.getElementById(id);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const DOM = { A: css('--dom-A'), B: css('--dom-B'), C: css('--dom-C'), D: css('--dom-D'), '': css('--dom-T') };
  const DNAME = { A: 'Military', B: 'Law enforcement', C: 'Economic', D: 'Legal and political', '': 'Trigger' };
  const DLIST = ['A', 'B', 'C', 'D'], DORDER = ['A', 'B', 'C', 'D', ''];
  const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const mname = m => MN[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4);
  const ymAdd = (m, k) => { const t = +m.slice(0, 4) * 12 + (+m.slice(5, 7) - 1) + k; return Math.floor(t / 12) + '-' + String(t % 12 + 1).padStart(2, '0'); };
  const f2 = v => (Math.round(v * 100) / 100).toFixed(2);
  const fw = v => Math.abs(v - Math.round(v)) < 0.005 ? String(Math.round(v)) : v.toFixed(2);
  const fz = v => String(+v.toFixed(2));
  const clamp01 = v => Math.max(0, Math.min(1, +v || 0));
  const BASE_MONTHS = V.months, NB = BASE_MONTHS.length;
  let months = BASE_MONTHS.slice(), N = NB, LABELS = months.map(mname), SCN = null;
  const dname = d => (V.domain_meta[d] || {}).name || DNAME[d];
  const tickFont = { family: css('--mono'), size: 10 };
  $('foot-version').textContent = 'version "' + V.label + '" · saved ' + (V.created_at || '').slice(0, 10);
  $('foot-built').textContent = 'built ' + (D.built_at || '').replace('T', ' ').slice(0, 16) + ' UTC';
  document.querySelectorAll('.sec-head').forEach(h => h.addEventListener('click', () => h.parentElement.classList.toggle('collapsed')));

  // ---- weights model ------------------------------------------------------------------------------------------------
  // index = normalise_to x sum(points) / total weight; each row's points are linear in its weight, so saved points /
  // saved weight is the row's monthly ramp (0-1).
  const INS = V.instruments, KEYS = INS.map(r => r.key);
  const TOTAL = 100, SAVED_TOTAL = V.scope_max_raw || INS.reduce((s, r) => s + r.weight, 0), NORM = V.normalise_to || 100;
  const W0 = {}, SW = {}, TYPE = {}, SAVED_RAMP = {}, RAMP_BASE = {}, RAMP = {}, DOMOF = {}, codes = {}, keyOf = {}, cnt = {};
  INS.forEach(r => {
    SW[r.key] = r.weight; DOMOF[r.key] = r.domain; TYPE[r.key] = r.type;
    SAVED_RAMP[r.key] = (V.points[r.key] || []).map(p => r.weight ? p / r.weight : 0);
    cnt[r.domain] = (cnt[r.domain] || 0) + 1; codes[r.key] = r.domain + cnt[r.domain]; keyOf[codes[r.key]] = r.key;
  });
  // starting weights: domain totals below, split over the domain's rows in proportion to the saved weights and rounded
  // to whole numbers by largest remainder (ties in registry order)
  const DSTART = { A: 30, B: 30, C: 30, D: 10 };
  DLIST.forEach(d => {
    const ks = KEYS.filter(k => DOMOF[k] === d), sw = ks.reduce((s, k) => s + SW[k], 0);
    const ex = ks.map(k => SW[k] * DSTART[d] / sw);
    ks.forEach((k, i) => { W0[k] = Math.floor(ex[i]); });
    const left = DSTART[d] - ks.reduce((s, k) => s + W0[k], 0);
    ks.map((k, i) => [k, ex[i] - W0[k], i]).sort((a, b) => b[1] - a[1] || a[2] - b[2]).slice(0, left).forEach(([k]) => { W0[k] += 1; });
  });
  let W = Object.assign({}, W0);
  const inDom = d => KEYS.filter(k => DOMOF[k] === d);
  const domSum = (d, w) => inDom(d).reduce((s, k) => s + (w || W)[k], 0);

  // ---- outcome rows: legs and adjustable 0-point lines ----------------------------------------------------------------
  // values and thresholds come from the saved monthly details text; a carried-forward month is scored but not drawn
  function parseLeg(key, leg) {
    let zero = null, full = null;
    const val = [], carried = [];
    (V.details[key] || []).forEach(t => {
      t = t || ''; carried.push(/^Carried forward/.test(t));
      if (leg) {
        const m = t.match(new RegExp(leg + ' ([+-]?[\\d.]+) \\(([^)]*)\\)'));
        if (m) { const th = m[2].match(/0 at ([+-]?[\d.]+), full at ([+-]?[\d.]+)/); if (th) { zero = +th[1]; full = +th[2]; } }
        val.push(m ? +m[1] : null); return;
      }
      const th = t.match(/0 at >= ([\d.]+)%, full at <= ([\d.]+)%/); if (th) { zero = +th[1]; full = +th[2]; }
      const m = t.match(/Taiwan ([\d.]+)%/); val.push(m ? +m[1] : null);
    });
    return { baseVal: val, baseDisp: val.map((v, i) => carried[i] ? null : v), zero, full };
  }
  const PANELS = [
    { row: 'C7', title: 'Blockade alarm', key: 'port_call_divergence', src: 'IMF PortWatch', charts: [
      { id: 'oc-c7a', sub: 'Leg 1: Strait traffic skipping Taiwan?', unit: '', legs: [{ leg: 'divergence anomaly', label: 'Divergence anomaly', min: -5, max: 25, step: 0.5 }] },
      { id: 'oc-c7b', sub: 'Leg 2: Fewer port calls than a year ago?', unit: '%', legs: [{ leg: 'calls eight ports', label: 'Eight ports', min: -40, max: 0, step: 0.5 }, { leg: 'calls kaohsiung', label: 'Kaohsiung', color: css('--navy'), min: -40, max: 0, step: 0.5 }] } ] },
    { row: 'C8', title: 'Trade bite', key: 'cross_strait_trade_shock', src: 'China customs (GACC)', charts: [
      { id: 'oc-c8a', sub: 'Leg A: Targeted ECFA goods losing share?', unit: '%', legs: [{ leg: 'targeted loss', label: 'Targeted loss', min: 0, max: 20, step: 0.5 }] },
      { id: 'oc-c8b', sub: 'Leg B: Broader trade share weakening?', unit: '%', legs: [{ leg: 'broad anomaly', label: 'Broad anomaly', min: -60, max: 0, step: 0.5 }] } ] },
    { row: 'C9', title: 'Rare-earth squeeze', key: 'ree_magnet_share_tw', src: 'China customs (GACC)', charts: [
      { id: 'oc-c9', sub: 'Leg 1: Rare-earth magnet shipments to Taiwan shrinking?', unit: '%', legs: [{ leg: null, label: 'Taiwan share', min: 0.6, max: 3.2, step: 0.05 }] } ] },
  ];
  const LEGS = [];
  PANELS.forEach(p => p.charts.forEach(c => c.legs.forEach(l => {
    Object.assign(l, parseLeg(p.key, l.leg), { key: p.key, name: l.leg || 'magnet share', unit: c.unit, color: l.color || DOM.C, li: LEGS.length });
    l.width = l.full - l.zero; l.z = l.zero; l.val = l.baseVal; l.disp = l.baseDisp; LEGS.push(l);
  })));
  const OKEYS = [...new Set(LEGS.map(l => l.key))];
  const zDefault = () => LEGS.every(l => Math.abs(l.z - l.zero) < 1e-9);

  // ---- scenario months --------------------------------------------------------------------------------------------
  // rows the scenario sets take its value (share of weight); other rows: episodic decay x0.6 a month and drop below 0.25
  // of the episode peak (config scoring.episodic), every other type keeps its last state; outcome legs keep their last
  // value unless the scenario gives one
  const EV_BASE = (D.event_list || []).filter(e => e.tier < 3);
  let EV = EV_BASE, SKEYS = new Set(), SLEGS = new Set();   // rows and legs the selected scenario sets (highlighted)
  // ladder rows that decay like episodic rows in scenario months (instrument_params rule: decaying)
  const DECAYING = new Set(['ccg_boarding_inspection']);
  function buildSeries() {
    const sm = SCN ? SCN.months : [], lastBase = BASE_MONTHS[NB - 1];
    months = BASE_MONTHS.concat(sm.map((_, j) => ymAdd(lastBase, j + 1))); N = months.length; LABELS = months.map(mname);
    KEYS.forEach(k => {
      const base = SAVED_RAMP[k], arr = base.slice();
      if (TYPE[k] === 'episodic' || DECAYING.has(k)) {
        let i = NB - 1; while (i > 0 && base[i] > 0 && base[i - 1] > base[i] + 1e-9) i--;   // start of the running episode
        let peak = base[NB - 1] > 0 ? base[i] : 0, age = base[NB - 1] > 0 ? NB - 1 - i : 0;
        sm.forEach(s => {
          const v = (s.set || {})[k], running = peak > 0 && Math.pow(0.6, age + 1) >= 0.25 ? peak * Math.pow(0.6, age + 1) : 0;
          if (v !== undefined && clamp01(v) >= running) { peak = clamp01(v); age = 0; arr.push(peak); }
          else { age++; arr.push(running); if (!running) peak = 0; }
        });
      } else sm.forEach(s => { const v = (s.set || {})[k]; arr.push(v !== undefined ? clamp01(v) : arr[arr.length - 1]); });
      RAMP_BASE[k] = arr;
    });
    LEGS.forEach(l => {
      let lastV = null; l.baseVal.forEach(v => { if (v !== null) lastV = v; });

  // matrix cells for the current months (rebuilt when the scenario changes); shading is set in refresh()
  function renderStrips() {
    $('weights').querySelector('.mhead .strip').innerHTML = months.map((m, i) => `<i class="${i >= NB ? 'sc' : ''}">${m.endsWith('-01') ? `<span>${m.slice(0, 4)}</span>` : ''}</i>`).join('');
    $('weights').querySelectorAll('.wrow[data-d] .strip').forEach(s => { s.innerHTML = months.map((m, i) => `<i data-i="${i}"></i>`).join(''); });
    $('weights').querySelectorAll('.wrow[data-k] .strip').forEach(s => {
      const fl = V.flags[s.closest('.wrow').dataset.k] || [];
      s.innerHTML = months.map((m, i) => `<i data-i="${i}"${i < NB && /no_data/.test(fl[i] || '') ? ' class="nd"' : ''}></i>`).join('');
    });
  }
  renderStrips();
  // hover on the index chart: box the month's column in the matrix and the cells of that month's key events
  function markMonth(i) {
    const box = $('weights'); box.querySelectorAll('.mk').forEach(e => e.remove());
    if (i === null || i === undefined) return;
    const head = box.querySelector(`.mhead .strip i:nth-child(${i + 1})`), col = box.querySelectorAll(`.strip i[data-i="${i}"]`);
    if (!head || !col.length) return;
    const b = box.getBoundingClientRect(), h = head.getBoundingClientRect(), z = col[col.length - 1].getBoundingClientRect();
    const add = (cls, l, t, w, ht) => box.insertAdjacentHTML('beforeend', `<div class="mk ${cls}" style="left:${l - b.left}px;top:${t - b.top}px;width:${w}px;height:${ht}px"></div>`);
    add('col', h.left - 2, h.top - 2, h.width + 4, z.bottom - h.top + 4);
    new Set(monthEvents(months[i]).map(e => keyOf[e.row]).filter(Boolean)).forEach(k => {
      const c = box.querySelector(`.wrow[data-k="${k}"] .strip i[data-i="${i}"]`); if (!c) return;
      const r = c.getBoundingClientRect(); add('ev', r.left - 3, r.top - 3, r.width + 6, r.height + 6);
    });
  }
  function wire(el, set) {
    const [rng, num] = el.querySelectorAll('input');
    rng.addEventListener('input', () => set(+rng.value));
    rng.addEventListener('change', endMove);
    num.addEventListener('input', () => { if (num.value !== '' && isFinite(+num.value)) set(+num.value); });
    num.addEventListener('change', endMove);
    num.addEventListener('blur', schedule);
  }
  $('weights').querySelectorAll('.wrow[data-k]').forEach(row => wire(row, v => setWeight(row.dataset.k, v)));
  $('weights').querySelectorAll('.wrow[data-d]').forEach(row => wire(row, v => setDomain(row.dataset.d, v)));
  document.querySelectorAll('.thr').forEach(el => wire(el, v => setZero(+el.dataset.l, v)));
  $('weights').addEventListener('mouseover', e => {
    const c = e.target.closest('.strip i[data-i]'); if (!c) return;
    const i = +c.dataset.i, row = c.closest('.wrow'), k = row.dataset.k, d = row.dataset.d, sc = i >= NB ? ' · scenario' : '';
    if (k) { const f = i < NB ? (V.flags[k] || [])[i] || '' : ''; c.title = `${mname(months[i])} · ${f2(RAMP[k][i] * W[k])} of ${fw(W[k])}${sc}${f ? ' · ' + f.replace(/;/g, ', ') : ''}`; }
    else c.title = `${mname(months[i])} · ${f2(cur.dom[d][i])} of ${fw(domSum(d))}${sc}`;
  });
  $('w-undo').addEventListener('click', undo);
  $('w-reset').addEventListener('click', reset);

  // ---- scenario selector ----------------------------------------------------------------------------------------------
  if (SCENARIOS.length) {
    $('scen-box').hidden = false;
    $('scen').innerHTML = '<option value="">Current</option>' + SCENARIOS.map(s => `<option value="${q(s.id)}" title="${q(s.narrative)}">${s.title}</option>`).join('');
    $('scen').value = SCN ? SCN.id : '';
    $('scen').addEventListener('change', () => {
      SCN = SCENARIOS.find(s => s.id === $('scen').value) || null;
      pinned = false; hoverIdx = null; $('tip').classList.remove('pinned'); $('tip').style.display = 'none'; $('hover-panel').style.display = 'none'; markMonth(null);
      const atEnd = R.hi === N - 1;
      buildSeries(); applyThresholds(); BASELINE = baselineIndex();
      R.hi = atEnd ? N - 1 : Math.min(R.hi, N - 1); R.lo = Math.max(0, Math.min(R.lo, R.hi - MIN_SPAN));
      renderStrips(); refresh();
    });
  }

  // ---- refresh everything from W, the 0-point lines and the scenario -------------------------------------------------
  let queued = false;
  function schedule() { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; refresh(); }); } }
  function setRow(row, val, changed) {
    const [rng, num] = row.querySelectorAll('input');
    rng.value = val; if (document.activeElement !== num) num.value = fw(val);
    row.classList.toggle('changed', changed);
  }
  function refresh() {
    cur = compute(); applyRange();
    const def = isDefault();
    chart.data.labels = LABELS; chart.data.datasets[0].data = cur.index; chart.data.datasets[1].data = BASELINE; chart.data.datasets[1].hidden = def; chart.update('none');
    $('index-latest').textContent = `${mname(months[N - 1])}: ${cur.index[N - 1].toFixed(1)}`;
    $('scen').classList.toggle('on', !!SCN);
    document.querySelectorAll('.oc h3[data-k]').forEach(h => h.classList.toggle('hl', SKEYS.has(h.dataset.k)));
    document.querySelectorAll('.oc-sub[data-legs]').forEach(s => s.classList.toggle('hl', s.dataset.legs.split('|').some(n => SLEGS.has(n))));
    if (hoverIdx !== null) showTip(hoverIdx);
    updateOutcome();
    mini.data.labels = LABELS; mini.data.datasets[0].data = cur.index; mini.update('none'); placeRange();
    $('w-total').innerHTML = `Total <b>${fw(KEYS.reduce((s, k) => s + W[k], 0))}</b>`;
    $('w-undo').disabled = !hist.length; $('w-reset').disabled = def && !hist.length;
    $('weights').querySelectorAll('.wrow[data-k]').forEach(row => {
      const k = row.dataset.k; setRow(row, W[k], Math.abs(W[k] - W0[k]) >= 0.005); row.classList.toggle('hl', SKEYS.has(k));
      row.querySelectorAll('.strip i[data-i]:not(.nd)').forEach(c => { c.style.opacity = Math.max(0.07, RAMP[k][+c.dataset.i]).toFixed(2); });
    });
    $('weights').querySelectorAll('.wrow[data-d]').forEach(row => {
      const d = row.dataset.d, s = domSum(d);
      setRow(row, s, Math.abs(s - domSum(d, W0)) >= 0.005);
      row.querySelectorAll('.strip i').forEach((c, i) => { c.style.opacity = Math.max(0.07, s > 1e-9 ? cur.dom[d][i] / s : 0).toFixed(2); });
    });
    writeHash();
  }
  refresh();
})();
</script>
</body>
</html>
